<script>
    var isAgeValid = true;

    window.onload = function() {
        toggleGroupOption();
        if(document.getElementById("dob").value) {
            calculateAge();
        }
    };

    function previewImage(event) {
        var input = event.target;
        var reader = new FileReader();
        reader.onload = function(){
            var dataURL = reader.result;
            var output = document.getElementById('photo_preview');
            output.src = dataURL;
            output.style.display = 'block';
        };
        if(input.files[0]) {
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Modern Navigation History check
    window.addEventListener("pageshow", function (event) {
        var perfEntries = performance.getEntriesByType("navigation");
        if (event.persisted || (perfEntries.length > 0 && perfEntries[0].type === "back_forward")) {
            window.location.reload();
        }
    });

    function toggleGroupOption() {
        var classSelect = document.getElementById("desired_class").value;
        var groupWrapper = document.getElementById("group_wrapper");
        var groupSelect = document.getElementById("group_name");

        if (classSelect === "একাদশ" || classSelect === "দ্বাদশ") {
            groupWrapper.style.display = "block";
            groupSelect.setAttribute("required", "required");
        } else {
            groupWrapper.style.display = "none";
            groupSelect.removeAttribute("required");
        }
    }

    function calculateAge() {
        var dobInput = document.getElementById("dob").value;
        var desiredClass = document.getElementById("desired_class").value;
        var msgElem = document.getElementById("age_status_msg");

        if (!dobInput) {
            msgElem.innerHTML = "";
            return;
        }

        var targetDateStr = "2027-01-01"; 
        var dob = new Date(dobInput);
        var targetDate = new Date(targetDateStr);

        if (dob > targetDate) {
            msgElem.style.color = "red";
            msgElem.innerHTML = "❌ জন্ম তারিখ ১ জানুয়ারি ২০২৭ অপেক্ষা পরবর্তী হতে পারবে না।";
            clearAgeFields();
            isAgeValid = false;
            return;
        }

        var years = targetDate.getFullYear() - dob.getFullYear();
        var months = targetDate.getMonth() - dob.getMonth();
        var days = targetDate.getDate() - dob.getDate();

        if (days < 0) {
            months--;
            var prevMonthLastDay = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0).getDate();
            days += prevMonthLastDay;
        }
        if (months < 0) {
            years--;
            months += 12;
        }

        document.getElementById("age_years").value = years;
        document.getElementById("age_months").value = months;
        document.getElementById("age_days").value = days;

        if (desiredClass === "নার্সারি") {
            var isUnder4 = (years < 4);
            var isOver5 = (years > 5 || (years === 5 && (months > 0 || days > 0)));

            if (isUnder4) {
                msgElem.style.color = "red";
                msgElem.innerHTML = "❌ বয়স কম! ১ জানুয়ারি ২০২৭ তারিখে বয়স সর্বনিম্ন ৪ বছর হতে হবে।";
                isAgeValid = false;
            } else if (isOver5) {
                msgElem.style.color = "red";
                msgElem.innerHTML = "❌ বয়স বেশি! ১ জানুয়ারি ২০২৭ তারিখে বয়স সর্বোচ্চ ৫ বছর হতে পারবে।";
                isAgeValid = false;
            } else {
                msgElem.style.color = "green";
                msgElem.innerHTML = "✅ বয়স সঠিক রয়েছে।";
                isAgeValid = true;
            }
        } else {
            msgElem.style.color = "#0d6efd";
            msgElem.innerHTML = "ℹ️ ১ জানুয়ারি ২০২৭ তারিখে হিসাবকৃত বয়স দেওয়া হলো।";
            isAgeValid = true;
        }
    }

    function clearAgeFields() {
        document.getElementById("age_years").value = "";
        document.getElementById("age_months").value = "";
        document.getElementById("age_days").value = "";
    }

    function validateFormBeforeSubmit() {
        if (!isAgeValid) {
            alert("বয়সের সামঞ্জস্যতা ঠিক নেই! অনুগ্রহ করে সঠিক জন্ম তারিখ প্রদান করুন।");
            return false;
        }
        return true;
    }

    // ঠিকানা কপি এবং সিঙ্ক করার ফাংশন
    function copyAddress() {
        var checkbox = document.getElementById('same_as_perm');
        var permAddr = document.getElementById('perm_address');
        var currAddr = document.getElementById('curr_address');

        if (checkbox.checked) {
            currAddr.value = permAddr.value;
            currAddr.readOnly = true;
        } else {
            currAddr.value = '';
            currAddr.readOnly = false;
        }
    }

    function syncAddress() {
        var checkbox = document.getElementById('same_as_perm');
        var permAddr = document.getElementById('perm_address');
        var currAddr = document.getElementById('curr_address');

        if (checkbox.checked) {
            currAddr.value = permAddr.value;
        }
    }
</script>

</body>
